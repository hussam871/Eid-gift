<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بطاقة تهنئة خاصة وعيد مبارك</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["K_Kamran", "Cairo", "Inter", "sans-serif"],
              serif: ["Cinzel", "Reem Kufi", "serif"],
              arabic: ["K_Kamran", "Cairo", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"]
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;550;700&family=Cinzel:wght@400;500;600;700;850&family=Inter:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

      @font-face {
        font-family: 'K_Kamran';
        src: url('https://www.wfonts.com/download/data/2016/05/29/k-kamran/K-Kamran.ttf') format('truetype'),
             url('https://arabicfonts.net/assets/fonts/k-kamran/download/K_Kamran.ttf') format('truetype'),
             local('K Kamran'),
             local('K_Kamran');
        font-weight: normal;
        font-style: normal;
      }

      body {
        font-family: 'K_Kamran', 'Cairo', 'Inter', sans-serif;
        background-color: #030014;
        color: #f3f4f6;
        overflow: hidden;
        user-select: none;
      }

      /* Background Canvas */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* Transitions and animations */
      .fade-out {
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
      }
      .fade-in {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      /* Text reflection glow */
      .glowing-text {
        text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
      }
    </style>
  </head>
  <body class="w-full h-screen relative flex items-center justify-center bg-[#02020a]">

    <canvas id="bg-canvas"></canvas>

          </div>

            بوابة المعايدة الخاصة
          </h1>
          <p class="text-[11px] text-sky-200/40 tracking-wider font-sans mt-1">
            مساحة هادئة لاستلام رسالتك المحمية بعناية
          </p>
        </div>

        <!-- Glassmorphic Login Form -->

          <form id="login-form" class="space-y-6">
            <div class="space-y-2">

      // Query Elements
      const loginForm = document.getElementById('login-form');
      const usernameInput = document.getElementById('username-input');
      const errorAlert = document.getElementById('error-alert');
      const errorText = document.getElementById('error-text');
      
      const loginScreen = document.getElementById('login-screen');
      const cardScreen = document.getElementById('card-screen');
      const cardTilter = document.getElementById('tilter-box');
      const cardGlare = document.getElementById('card-glare');
      const btnLogout = document.getElementById('btn-logout');

      const profileDisplayName = document.getElementById('profile-display-name');
      const profilePersonalTitle = document.getElementById('profile-personal-title');
      const profileMessage = document.getElementById('profile-message');

      // Setup Lucide icons initially
      lucide.createIcons();

      // Form validation entry
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const userInput = usernameInput.value.trim().toLowerCase();
        
        const profile = USERS_DB[userInput];
        if (!profile) {
          errorAlert.classList.remove('hidden');
          if (navigator.vibrate) navigator.vibrate(100);
          return;
        }

        // Hide errors
        errorAlert.classList.add('hidden');

        // Populate card contents
        profileDisplayName.textContent = profile.displayName;
        profilePersonalTitle.textContent = profile.personalTitle || '';
        profileMessage.textContent = profile.message;

        // Transition screens
        loginScreen.classList.remove('fade-in');
        loginScreen.classList.add('fade-out');

        setTimeout(() => {
          loginScreen.classList.add('hidden');
          cardScreen.classList.remove('hidden');
          
          // Trigger entry layout
          setTimeout(() => {
            cardScreen.classList.remove('fade-out');
            cardScreen.classList.add('fade-in');
          }, 50);
        }, 700);
      });

      // Going back action
      btnLogout.addEventListener('click', () => {
        cardScreen.classList.remove('fade-in');
        cardScreen.classList.add('fade-out');

        setTimeout(() => {
          cardScreen.classList.add('hidden');
          loginScreen.classList.remove('hidden');

          setTimeout(() => {
            loginScreen.classList.remove('fade-out');
            loginScreen.classList.add('fade-in');
            usernameInput.value = '';
          }, 50);
        }, 700);
      });

      // 3D Tilting engine & Gloss glare tracker
      document.addEventListener('mousemove', (e) => {
        if (cardScreen.classList.contains('hidden')) return;

        const rect = cardTilter.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        const x = e.clientX - rect.left - width / 2;
        const y = e.clientY - rect.top - height / 2;

        const normX = x / (width / 2);
        const normY = y / (height / 2);

        // Max rotate limit of 14 degrees
        const tiltX = normX * 14;
        const tiltY = -normY * 14;

        cardTilter.style.transform = `perspective(1000px) rotateY(${tiltX}deg) rotateX(${tiltY}deg)`;

        // Glisten glare tracking coordinate
        const glareX = ((e.clientX - rect.left) / width) * 100;
        const glareY = ((e.clientY - rect.top) / height) * 100;
        cardGlare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 70%)`;
      });

      // Ease out card tilt returning pointer
      document.addEventListener('mouseleave', () => {
        cardTilter.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
        cardTilter.style.transition = `transform 0.5s ease-out`;
        cardGlare.style.background = `radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 60%)`;
      });

      // Re-enable smooth transition hover adjustments
      cardTilter.addEventListener('mouseenter', () => {
        cardTilter.style.transition = 'transform 0.1s ease-out';
      });

      // Canvas ambient particle space drift setup
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 1.8 + 0.2;
          this.speedX = (Math.random() - 0.5) * 0.18;
          this.speedY = (Math.random() - 0.5) * 0.18;
          this.alpha = Math.random() * 0.8 + 0.1;
          this.fadeSpeed = Math.random() * 0.005 + 0.002;
          this.isBlooming = Math.random() > 0.5;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.isBlooming) {
            this.alpha += this.fadeSpeed;
            if (this.alpha >= 0.95) this.isBlooming = false;
          } else {
            this.alpha -= this.fadeSpeed;
            if (this.alpha <= 0.05) this.isBlooming = true;
          }

          if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.reset();
          }
        }

        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(147, 197, 253, ${this.alpha})`;
          ctx.shadowBlur = this.size * 4;
          ctx.shadowColor = '#818cf8';
          ctx.fill();
          ctx.restore();
        }
      }

      const particles = Array.from({ length: 85 }, () => new Particle());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
