    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Cairo", "Inter", "sans-serif"],
              serif: ["Reem Kufi", "Cinzel", "serif"],
              mono: ["JetBrains Mono", "monospace"]
            },
            animation: {
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'bounce-slow': 'bounce-slow 4s ease-in-out infinite',
              'float-slow': 'float-slow 7s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
            }
          }
        }
      }

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Cinzel:wght@500;700;900&family=Reem+Kufi:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

      body {
        font-family: 'Cairo', sans-serif;
        background-color: #02020e;
        color: #f8fafc;
        overflow: hidden;
        user-select: none;
      }

      /* Animated flowing background canvas */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* Liquid Glassmorphic cards with native webkit blur support */
      .liquid-glass {
        background: transparent;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        box-shadow: 
          0 35px 80px -15px rgba(0, 0, 0, 0.5),
          inset 0 1px 2px rgba(255, 255, 255, 0.2),
          inset 0 -1px 20px rgba(139, 92, 246, 0.02);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
      }

      .liquid-glass:hover {
        background: rgba(255, 255, 255, 0.02);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 
          0 40px 90px -10px rgba(0, 0, 0, 0.6),
          inset 0 1px 3px rgba(255, 255, 255, 0.3),
          inset 0 -1px 25px rgba(139, 92, 246, 0.04);
      }

      .liquid-inner-card {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      /* Transitions and animations */
      .fade-out {
        opacity: 0;
        transform: scale(0.96) translateY(12px);
        pointer-events: none;
      }
      .fade-in {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: auto;
      }

      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      .animate-float-slow {
        animation: float-slow 7s ease-in-out infinite;
      }

      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-bounce-slow {
        animation: bounce-slow 4s ease-in-out infinite;
      }

      /* Flow interactive ripple background */
      .glow-blob {
        filter: blur(140px);
        mix-blend-mode: plus-lighter;
      }
    </style>
  </head>

      const loginForm = document.getElementById('login-form');
      const usernameInput = document.getElementById('username-input');
      const errorAlert = document.getElementById('error-alert');
      
      const loginScreen = document.getElementById('login-screen');
      const cardScreen = document.getElementById('card-screen');
      const cardTilter = document.getElementById('tilter-box');
      const cardGlare = document.getElementById('card-glare');
      const btnLogout = document.getElementById('btn-logout');

      const profileDisplayName = document.getElementById('profile-display-name');
      const profilePersonalTitle = document.getElementById('profile-personal-title');
      const profileMessage = document.getElementById('profile-message');

      // Setup and load Lucide indicators
      lucide.createIcons();

      // Submit/login state handler
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const userInput = usernameInput.value.trim().toLowerCase();
        
        const profile = USERS_DB[userInput];
        if (!profile) {
          errorAlert.classList.remove('hidden');
          if (navigator.vibrate) navigator.vibrate(100);
          return;
        }

        // Dissolve alert
        errorAlert.classList.add('hidden');

        // Populate card contents
        profileDisplayName.textContent = profile.displayName;
        profilePersonalTitle.textContent = profile.personalTitle || '';
        profileMessage.textContent = profile.message;

        // Perform seamless screen crossfade
        loginScreen.classList.remove('fade-in');
        loginScreen.classList.add('fade-out');

        setTimeout(() => {
          loginScreen.classList.add('hidden');
          cardScreen.classList.remove('hidden');
          
          setTimeout(() => {
            cardScreen.classList.remove('fade-out');
            cardScreen.classList.add('fade-in');
          }, 50);
        }, 700);
      });

      // Back state trigger
      btnLogout.addEventListener('click', () => {
        cardScreen.classList.remove('fade-in');
        cardScreen.classList.add('fade-out');

        setTimeout(() => {
          cardScreen.classList.add('hidden');
          loginScreen.classList.remove('hidden');

          setTimeout(() => {
            loginScreen.classList.remove('fade-out');
            loginScreen.classList.add('fade-in');
            usernameInput.value = '';
          }, 50);
        }, 700);
      });

      // Liquid 3D Mouse Movement Tracker
      document.addEventListener('mousemove', (e) => {
        if (cardScreen.classList.contains('hidden')) return;

        const rect = cardTilter.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        const x = e.clientX - rect.left - (width / 2);
        const y = e.clientY - rect.top - (height / 2);

        const normX = x / (width / 2);
        const normY = y / (height / 2);

        // Moderate 12-deg max rotation for tactile organic feeling
        const rotY = normX * 12;
        const rotX = -normY * 12;

        cardTilter.style.transform = `perspective(1000px) rotateY(${rotY}deg) rotateX(${rotX}deg)`;

        // Liquid sheen overlay trajectory positioning
        const glareX = ((e.clientX - rect.left) / width) * 100;
        const glareY = ((e.clientY - rect.top) / height) * 100;
        cardGlare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 75%)`;
      });

      // Returning card tilt elegantly on leave
      document.addEventListener('mouseleave', () => {
        cardTilter.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
        cardTilter.style.transition = `transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)`;
        cardGlare.style.background = `radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 60%)`;
      });

      cardTilter.addEventListener('mouseenter', () => {
        cardTilter.style.transition = 'transform 0.15s ease-out';
      });


      // Dynamic Flow Wave System on background canvas
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Wave physics parameters that draw flowing line curves of indigo, violet, and sky-blue
      class FlowWave {
        constructor(yOffset, speed, amplitude, frequency, strokeStyle, shadowColor, lineWidth) {
          this.yOffset = yOffset;
          this.speed = speed;
          this.amplitude = amplitude;
          this.frequency = frequency;
          this.strokeStyle = strokeStyle;
          this.shadowColor = shadowColor;
          this.lineWidth = lineWidth;
          this.phase = Math.random() * 100;
        }

        update() {
          this.phase += this.speed;
        }

        draw() {
          ctx.beginPath();
          ctx.strokeStyle = this.strokeStyle;
          ctx.lineWidth = this.lineWidth;
          ctx.shadowBlur = 18;
          ctx.shadowColor = this.shadowColor;
          ctx.lineCap = 'round';

          for (let x = 0; x < width; x += 6) {
            // Flow sine formula with multi-frequency harmony
            const y = this.yOffset 
              + Math.sin(x * this.frequency + this.phase) * this.amplitude 
              + Math.cos(x * 0.001 - this.phase * 0.4) * (this.amplitude * 0.35);

            if (x === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
      }

      // Initialize flow waves with beautiful blue, purple, and lavender palettes
      const waveList = [
        // Dense underlying heavy wave
        new FlowWave(height * 0.42, 0.003, 85, 0.0015, 'rgba(139, 92, 246, 0.4)', 'rgba(139, 92, 246, 0.4)', 3.5),
        // Vibrating secondary bright wave (blue/sky)
        new FlowWave(height * 0.55, -0.004, 60, 0.0025, 'rgba(56, 189, 248, 0.35)', 'rgba(56, 189, 248, 0.35)', 2.5),
        // Overlapping magenta-tinted light flow
        new FlowWave(height * 0.35, 0.002, 110, 0.001, 'rgba(168, 85, 247, 0.25)', 'rgba(168, 85, 247, 0.25)', 4.0),
        // Rapid thin highlighter glow line
        new FlowWave(height * 0.48, -0.006, 45, 0.004, 'rgba(99, 102, 241, 0.5)', 'rgba(99, 102, 241, 0.5)', 2.0)
      ];

      // Tiny stars/sparkles drifting concurrently through background coordinates
      class DriftingStar {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.radius = Math.random() * 1.5 + 0.3;
          this.alpha = Math.random() * 0.7 + 0.15;
          this.speedX = (Math.random() - 0.5) * 0.08;
          this.speedY = (Math.random() - 0.5) * 0.08;
          this.pulseSpeed = Math.random() * 0.01 + 0.003;
          this.pulseUp = Math.random() > 0.5;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          
          if (this.pulseUp) {
            this.alpha += this.pulseSpeed;
            if (this.alpha >= 0.9) this.pulseUp = false;
          } else {
            this.alpha -= this.pulseSpeed;
            if (this.alpha <= 0.1) this.pulseUp = true;
          }

          if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.reset();
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(165, 180, 252, ${this.alpha})`;
          ctx.shadowBlur = this.radius * 3;
          ctx.shadowColor = '#818cf8';
          ctx.fill();
        }
      }

      const starCollection = Array.from({ length: 60 }, () => new DriftingStar());

      // Consolidated Canvas Render loop
      function animateLoop() {
        ctx.clearRect(0, 0, width, height);
        
        // Zero shadow blur for performance star renders
        ctx.shadowBlur = 0;
        starCollection.forEach((star) => {
          star.update();
          star.draw();
        });

        // Elevated shadow state for flowing lines
        waveList.forEach((wave) => {
          wave.update();
          wave.draw();
        });

        requestAnimationFrame(animateLoop);
      }

      animateLoop();
    </script>
  </body>
</html>
